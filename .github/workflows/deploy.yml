# Builds the game and publishes it on GitHub Pages on every push to main.
# The site is the regular multi-file build (dist/index.html + assets/), which
# browsers cache and load in parallel; dist/phony-business.html (the single
# self-contained file) is published next to it as a download.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # optional checkout link for the token store (repository variable STORE_URL)
      - run: npm run build
        env:
          VITE_STORE_URL: ${{ vars.STORE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
